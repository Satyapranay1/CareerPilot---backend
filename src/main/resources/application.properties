spring.application.name=careerpilot


# =========================================================
# SERVER
# =========================================================

server.port=8080


# =========================================================
# POSTGRESQL + PGVECTOR
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=root

spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.zaxxer.hikari=DEBUG

# =========================================================
# RESUME ANALYZER
# =========================================================

careerpilot.resume.storage-directory=uploads/resumes

# 5 MB
careerpilot.resume.max-file-size=5242880

# Spring multipart protection
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

careerpilot.knowledge.path=classpath:knowledge/*.md


# =========================================================
# JPA / HIBERNATE
# =========================================================

# Tables are created manually using SQL
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# JWT
# =========================================================

jwt.secret=CareerPilotSuperSecretJwtSigningKey2026CareerPilotSecurity

# 15 minutes
jwt.expiration=900000

# 7 days
jwt.refresh-expiration=604800000


# =========================================================
# SPRING AI - OLLAMA
# =========================================================

spring.ai.ollama.base-url=http://localhost:11434


# =========================================================
# LLAMA - CHAT MODEL
# =========================================================

spring.ai.ollama.chat.options.model=llama3.2:3b

# Lower temperature = more consistent interview evaluation
spring.ai.ollama.chat.options.temperature=0.2


# =========================================================
# OLLAMA - EMBEDDING MODEL
# =========================================================

spring.ai.ollama.embedding.options.model=nomic-embed-text


# =========================================================
# PGVECTOR VECTOR STORE
# =========================================================

# Spring AI creates/manages the vector_store table
spring.ai.vectorstore.pgvector.initialize-schema=true

spring.ai.vectorstore.pgvector.table-name=vector_store

# nomic-embed-text uses 768-dimensional embeddings
spring.ai.vectorstore.pgvector.dimensions=768

spring.ai.vectorstore.pgvector.index-type=HNSW

spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE


# =========================================================
# CAREERPILOT RAG
# =========================================================

# Static RAG documents if we add technical reference material later
careerpilot.rag.path=classpath:rag-data

# Useful during development
careerpilot.rag.debug=true


# =========================================================
# INTERVIEW RAG
# =========================================================

# Maximum characters fetched from company website content
careerpilot.rag.company.max-content-length=30000

# Company website chunk size
careerpilot.rag.company.chunk-size=1500

# Job description chunk size
careerpilot.rag.jd.chunk-size=1200

# Number of RAG results supplied to Llama
careerpilot.rag.top-k=8


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.ai=INFO

logging.level.com.example.careerpilot=INFO