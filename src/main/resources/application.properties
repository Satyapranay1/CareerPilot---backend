spring.application.name=careerpilot


# =========================================================
# SERVER
# =========================================================

server.port=8080


# =========================================================
# POSTGRESQL + PGVECTOR
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=root

spring.datasource.driver-class-name=org.postgresql.Driver

# Development logging
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.com.zaxxer.hikari=INFO


# =========================================================
# RESUME ANALYZER
# =========================================================

careerpilot.resume.storage-directory=uploads/resumes

# 5 MB
careerpilot.resume.max-file-size=5242880

spring.jackson.serialization.write-dates-as-timestamps=false

# Spring multipart protection
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

careerpilot.knowledge.path=classpath:knowledge/*.md


# =========================================================
# JPA / HIBERNATE
# =========================================================

# Tables are created manually using SQL
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# JWT
# =========================================================

jwt.secret=CareerPilotSuperSecretJwtSigningKey2026CareerPilotSecurity

# 15 minutes
jwt.expiration=900000

# 7 days
jwt.refresh-expiration=604800000


# =========================================================
# SPRING AI - OLLAMA
# =========================================================

spring.ai.ollama.base-url=http://localhost:11434


# =========================================================
# LLAMA - CHAT MODEL
# =========================================================

# Lightweight local model
spring.ai.ollama.chat.options.model=llama3.2:1b

# Consistent interview/resume evaluation
spring.ai.ollama.chat.options.temperature=0.1


# Limit generated output
spring.ai.ollama.chat.options.num-predict=1200


# =========================================================
# OLLAMA - EMBEDDING MODEL
# =========================================================

spring.ai.ollama.embedding.options.model=nomic-embed-text


# =========================================================
# PGVECTOR VECTOR STORE
# =========================================================

# Spring AI creates/manages the vector_store table
spring.ai.vectorstore.pgvector.initialize-schema=true

spring.ai.vectorstore.pgvector.table-name=vector_store

# nomic-embed-text uses 768-dimensional embeddings
spring.ai.vectorstore.pgvector.dimensions=768

spring.ai.vectorstore.pgvector.index-type=HNSW

spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE


# =========================================================
# CAREERPILOT RAG
# =========================================================

careerpilot.rag.path=classpath:rag-data

# Disable verbose RAG debugging
careerpilot.rag.debug=false


# =========================================================
# INTERVIEW RAG
# =========================================================

# Reduced company context
careerpilot.rag.company.max-content-length=5000

# Smaller chunks = less context
careerpilot.rag.company.chunk-size=700

careerpilot.rag.jd.chunk-size=600

# Retrieve only the most relevant chunks
careerpilot.rag.top-k=2


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.ai=WARN

logging.level.com.example.careerpilot=INFO